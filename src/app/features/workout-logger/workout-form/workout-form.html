<div class="max-w-3xl mx-auto">
    <div class="flex items-center mb-8">
        <a routerLink="/workouts"
            class="mr-4 p-2 rounded-full hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <h1 class="text-3xl font-bold text-white">
            <ng-container *ngIf="isEditMode" i18n="@@workout.title.edit">Edit Workout</ng-container>
            <ng-container *ngIf="!isEditMode" i18n="@@workout.title.log">Log Workout</ng-container>
        </h1>
    </div>

    <form [formGroup]="workoutForm" (ngSubmit)="onSubmit()" class="space-y-8">
        <!-- Main Info -->
        <div class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-gray-700 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                <div>
                    <label i18n="@@workout.nameLabel" class="block text-sm font-medium text-gray-400 mb-2">Workout
                        Name</label>
                    <input type="text" formControlName="name"
                        class="block w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
                        placeholder="e.g. Legs Day" i18n-placeholder="@@workout.namePlaceholder">
                </div>
                <div>
                    <label i18n="@@workout.dateLabel" class="block text-sm font-medium text-gray-400 mb-2">Date</label>
                    <input type="date" formControlName="date"
                        class="block w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors min-w-0">
                </div>
            </div>
        </div>

        <!-- Exercises -->
        <div formArrayName="exercises" class="space-y-6">
            <div *ngFor="let exercise of exercises.controls; let i=index" [formGroupName]="i"
                class="bg-gray-800 rounded-xl border border-gray-700 shadow-xl animate-fade-in relative"
                [class.z-20]="activeDropdownIndex === i" [class.z-0]="activeDropdownIndex !== i">
                <div
                    class="bg-gray-750 p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50 rounded-t-xl">
                    <div class="flex items-center flex-1 mr-4">
                        <span class="bg-blue-600/20 text-blue-400 text-xs font-bold px-2 py-1 rounded mr-3">#{{i +
                            1}}</span>
                        <div class="relative exercise-autocomplete-container">
                            <input type="text" formControlName="name" (focus)="openDropdown(i)"
                                (input)="onSearchInput($event, i)"
                                class="bg-gray-800 border-0 border-b border-transparent focus:border-blue-500 text-white font-semibold w-full focus:ring-0 px-2 py-1 placeholder-gray-500 rounded transition-colors"
                                placeholder="Exercise Name (e.g. Bench Press)"
                                i18n-placeholder="@@workout.exercisePlaceholder" autocomplete="off">

                            <!-- Dropdown Results -->
                            <div *ngIf="activeDropdownIndex === i"
                                class="absolute z-50 left-0 mt-1 w-full bg-gray-800 border border-gray-700 rounded-lg shadow-xl max-h-60 overflow-y-auto">
                                <ul class="py-1">
                                    <li *ngFor="let ex of filteredExercises" (click)="selectExercise(i, ex)"
                                        class="px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white cursor-pointer transition-colors">
                                        {{ ex }}
                                    </li>
                                    <li *ngIf="filteredExercises.length === 0"
                                        class="px-4 py-2 text-sm text-gray-500 italic" i18n="@@workout.noMatches">
                                        No matches found. Custom exercise will be added.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <button type="button" (click)="removeExercise(i)"
                        class="text-gray-500 hover:text-red-400 transition-colors p-1" title="Remove Exercise">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <div class="p-4 bg-gray-900/30 rounded-b-xl">
                    <div
                        class="grid grid-cols-10 gap-4 mb-2 text-xs font-medium text-gray-500 uppercase tracking-wider px-2">
                        <div i18n="@@workout.header.set" class="col-span-1 text-center">Set</div>
                        <div i18n="@@workout.header.reps" class="col-span-4">Reps</div>
                        <div i18n="@@workout.header.weight" class="col-span-4">Weight (kg)</div>
                        <div class="col-span-1"></div>
                    </div>

                    <div formArrayName="sets" class="space-y-3">
                        <div *ngFor="let set of getSets(i).controls; let j=index" [formGroupName]="j"
                            class="grid grid-cols-10 gap-4 items-center animate-slide-in">
                            <div class="col-span-1 text-center text-gray-400 text-sm font-mono">{{j + 1}}</div>
                            <div class="col-span-4">
                                <input type="number" formControlName="reps"
                                    class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-center focus:border-blue-500 focus:outline-none transition-colors"
                                    min="1">
                            </div>
                            <div class="col-span-4">
                                <input type="number" formControlName="weight"
                                    class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-center focus:border-blue-500 focus:outline-none transition-colors"
                                    min="0">
                            </div>
                            <div class="col-span-1 text-center">
                                <button type="button" (click)="removeSet(i, j)"
                                    class="text-gray-600 hover:text-red-400 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20"
                                        fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button" (click)="addSet(i)"
                        class="mt-4 text-xs font-semibold text-blue-400 hover:text-blue-300 uppercase tracking-wide flex items-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                                clip-rule="evenodd" />
                        </svg>
                        <span i18n="@@workout.addSet">Add Set</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 pt-4">
            <button type="button" (click)="addExercise()"
                class="flex-1 py-3 px-4 bg-gray-800 border border-dashed border-gray-600 text-gray-300 rounded-xl hover:bg-gray-750 hover:border-gray-500 hover:text-white transition-all font-medium flex justify-center items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                        clip-rule="evenodd" />
                </svg>
                <span i18n="@@workout.addExercise">Add Exercise</span>
            </button>

            <button type="submit" [disabled]="!workoutForm.valid"
                class="flex-1 py-3 px-4 bg-gradient-to-r from-blue-600 to-teal-600 text-white rounded-xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:from-blue-500 hover:to-teal-500 transition-all font-bold disabled:opacity-50 disabled:cursor-not-allowed">
                <span i18n="@@workout.saveWorkout">Save Workout</span>
            </button>
        </div>
    </form>
</div>
