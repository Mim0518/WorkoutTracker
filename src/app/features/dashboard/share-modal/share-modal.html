<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-gray-900 bg-opacity-80 transition-opacity backdrop-blur-sm" (click)="closeModal()">
    </div>

    <div class="flex items-center justify-center min-h-screen p-4">
        <div
            class="bg-gray-800 rounded-xl shadow-2xl max-w-md w-full border border-gray-700 overflow-hidden transform transition-all">

            <!-- Header -->
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white" i18n="@@share.title">Share Your Progress</h3>
                <button (click)="closeModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Preview Area (The part to capture) -->
            <div class="p-6 flex justify-center bg-gray-900/50">
                <div #captureArea
                    class="bg-gradient-to-br from-blue-900 via-gray-900 to-purple-900 p-8 rounded-2xl shadow-xl w-full aspect-[4/5] flex flex-col justify-between relative overflow-hidden border border-gray-700/50">
                    <!-- Background Decoration -->
                    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl">
                    </div>

                    <!-- App Brand -->
                    <div class="flex items-center space-x-2 z-10">
                        <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-xl">W</span>
                        </div>
                        <span class="text-white font-bold tracking-wider">WORKOUT TRACKER</span>
                    </div>

                    <!-- Main Stats -->
                    <div class="space-y-6 z-10 my-8">
                        <div>
                            <div class="text-gray-400 text-xs uppercase tracking-widest mb-1"
                                i18n="@@share.totalWorkouts">Total Workouts</div>
                            <div class="text-5xl font-black text-white">{{ stats.workouts }}</div>
                        </div>

                        <div>
                            <div class="text-gray-400 text-xs uppercase tracking-widest mb-1"
                                i18n="@@share.volumeMoved">Volume Moved</div>
                            <div class="text-4xl font-bold text-blue-400">
                                {{ stats.volume | number:'1.0-0' }} <span class="text-lg text-white/60">kg</span>
                            </div>
                        </div>

                        <div>
                            <div class="text-gray-400 text-xs uppercase tracking-widest mb-1"
                                i18n="@@share.exercisesMastered">Exercises</div>
                            <div class="text-3xl font-bold text-purple-400">{{ stats.exercises }}</div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="z-10 mt-auto pt-6 border-t border-white/10 flex justify-between items-end">
                        <div>
                            <div class="text-gray-400 text-[10px] uppercase">Generated On</div>
                            <div class="text-white text-sm font-medium">{{ currentDate }}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-white text-sm font-bold opacity-80">#KeepPushing</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="px-6 py-4 bg-gray-800 border-t border-gray-700 flex justify-end space-x-3">
                <button (click)="closeModal()"
                    class="px-4 py-2 bg-gray-700 text-gray-300 rounded-lg hover:bg-gray-600 transition-colors text-sm font-medium"
                    i18n="@@share.cancel">
                    Cancel
                </button>
                <button (click)="captureImage()" [disabled]="isGenerating"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors flex items-center space-x-2 text-sm font-bold shadow-lg shadow-blue-900/20">
                    <svg *ngIf="!isGenerating" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                    <svg *ngIf="isGenerating" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span i18n="@@share.download">Download Image</span>
                </button>
            </div>
        </div>
    </div>
</div>
