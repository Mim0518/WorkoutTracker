<div [class]="'p-4 rounded-xl border flex items-start space-x-4 shadow-lg mb-4 relative overflow-hidden ' + colorClass">
    <div class="text-2xl">{{ icon }}</div>
    <div class="flex-1">
        <h3 class="font-bold text-sm uppercase tracking-wider opacity-90 mb-1">{{ notification.title }}</h3>
        <p class="text-sm opacity-80 leading-relaxed">{{ notification.message }}</p>

        <!-- Action Button (if actionable) -->
        <!-- For now, the action is just informational or manual, but we could add buttons here later -->
    </div>

    <button (click)="dismiss.emit()"
        class="absolute top-2 right-2 text-current opacity-40 hover:opacity-100 transition-opacity p-1" title="Dismiss"
        i18n-title="@@prediction.notification.dismiss">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd" />
        </svg>
    </button>
</div>
