<div class="min-h-screen flex flex-col bg-gray-900 text-gray-100">
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <nav class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center">
        <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
          WorkoutTracker
        </span>
      </div>
      <div class="flex space-x-4">
        <a routerLink="/dashboard" routerLinkActive="text-blue-400 bg-gray-700/50"
          class="px-3 py-2 rounded-md text-sm font-medium hover:text-blue-400 hover:bg-gray-700 transition-colors"
          i18n="@@nav.stats">
          Stats
        </a>
        <a routerLink="/workouts" routerLinkActive="text-blue-400 bg-gray-700/50"
          [routerLinkActiveOptions]="{exact: true}"
          class="px-3 py-2 rounded-md text-sm font-medium hover:text-blue-400 hover:bg-gray-700 transition-colors"
          i18n="@@nav.workouts">
          Workouts
        </a>
        <a routerLink="/workouts/new" routerLinkActive="text-blue-400 bg-gray-700/50"
          class="px-3 py-2 rounded-md text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white transition-colors shadow-lg shadow-blue-500/20">
          <span i18n="@@nav.logNew">+ Log</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 border-t border-gray-700 mt-auto">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="assets/af-white.png" alt="AFDevelopment"
          class="h-6 w-auto opacity-80 hover:opacity-100 transition-opacity">
        <span class="text-sm text-gray-400">Made with ❤️ AFDevelopment© </span>
      </div>
    </div>
  </footer>

  <!-- Scroll to Top Button -->
  <button *ngIf="showScrollButton" (click)="scrollToTop()"
    class="fixed bottom-6 right-6 z-50 p-3 rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-500 transition-all"
    title="Scroll to Top" i18n-title="@@app.scrollToTop">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
  </button>
</div>
