<div class="min-h-screen flex flex-col bg-gray-900 text-gray-100">
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <nav class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center">
        <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
          WorkoutTracker
        </span>
      </div>
      <div class="flex space-x-4">
        <a routerLink="/dashboard" routerLinkActive="text-blue-400 bg-gray-700/50"
          class="px-3 py-2 rounded-md text-sm font-medium hover:text-blue-400 hover:bg-gray-700 transition-colors">
          Stats
        </a>
        <a routerLink="/workouts" routerLinkActive="text-blue-400 bg-gray-700/50"
          [routerLinkActiveOptions]="{exact: true}"
          class="px-3 py-2 rounded-md text-sm font-medium hover:text-blue-400 hover:bg-gray-700 transition-colors">
          Workouts
        </a>
        <a routerLink="/workouts/new" routerLinkActive="text-blue-400 bg-gray-700/50"
          class="px-3 py-2 rounded-md text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white transition-colors shadow-lg shadow-blue-500/20">
          + Log
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <router-outlet></router-outlet>
  </main>
</div>
